<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Créer un article | Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <script src="./form.js" type="module"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <a class="header-brand" href="../index.html">Blog</a>
        <div class="header-menu">
          <button
            class="header-menu-button"
            type="button"
            aria-expanded="false"
            aria-controls="main-navigation"
          >
            <span aria-hidden="true">☰</span>
            <span class="visually-hidden">Ouvrir le menu</span>
          </button>
          <nav id="main-navigation" aria-label="Navigation principale">
            <ul>
              <li>
                <a href="../index.html" class="header-nav">Accueil</a>
              </li>
              <li>
                <a
                  href="./form.html"
                  class="header-nav active"
                  aria-current="page"
                >
                  Créer un article
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </header>

      <main class="content">
        <form id="article-form" novalidate>
          <h1 class="title-underline">Ajouter un article</h1>

          <div class="form-group">
            <label for="author">Auteur</label>
            <input
              id="author"
              type="text"
              name="author"
              autocomplete="name"
              required
            />
          </div>

          <div class="form-group">
            <label for="img">Image de profil</label>
            <input id="img" type="url" name="img" required />
          </div>

          <div class="form-group">
            <label for="category">Catégorie</label>
            <input id="category" type="text" name="category" required />
          </div>

          <div class="form-group">
            <label for="title">Titre</label>
            <input id="title" type="text" name="title" required />
          </div>

          <div class="form-group">
            <label for="content">Article</label>
            <textarea id="content" name="content" required></textarea>
          </div>

          <ul
            class="text-error"
            id="errors"
            aria-live="polite"
            aria-atomic="true"
          ></ul>

          <div class="form-btn-container">
            <button class="btn btn-secondary" type="reset">Annuler</button>
            <button class="btn btn-primary" type="submit">Sauvegarder</button>
          </div>
        </form>
      </main>

      <footer><small>&copy; Blog</small></footer>
    </div>
  </body>
</html>
